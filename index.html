<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Join Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #46178f, #6d28d9);
}

.card {
    background: white;
    width: 360px;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

.logo {
    font-size: 42px;
    font-weight: 900;
    color: #46178f;
    margin-bottom: 25px;
}

.subtitle {
    color: #333;
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: bold;
}

.pin {
    width: 100%;
    font-size: 28px;
    padding: 14px;
    text-align: center;
    border: 2px solid #ddd;
    border-radius: 10px;
    outline: none;
    letter-spacing: 4px;
}

.pin:focus {
    border-color: #46178f;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #222;
}

.error {
    color: red;
    margin-top: 10px;
    display: none;
    font-size: 14px;
}

/* joining screen */
.loading {
    display: none;
    margin-top: 20px;
}

.dots {
    display: flex;
    justify-content: center;
    gap: 6px;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #46178f;
    animation: bounce 0.6s infinite alternate;
}

.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
    from { transform: translateY(0); opacity: 0.5; }
    to { transform: translateY(-8px); opacity: 1; }
}

.status {
    margin-top: 10px;
    color: #333;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">kahoot</div>

    <div class="subtitle">Enter Game PIN</div>

    <input id="pin" class="pin" placeholder="------" maxlength="10">

    <button onclick="join()">Enter</button>

    <div class="error" id="error">Invalid game PIN</div>

    <div class="loading" id="loading">
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="status">Joining game...</div>
    </div>

</div>

<script>
function join() {
    const pin = document.getElementById("pin").value;
    const error = document.getElementById("error");
    const loading = document.getElementById("loading");

    error.style.display = "none";

    if (pin !== "biingle") {
        error.style.display = "block";
        return;
    }

    // show loading animation
    loading.style.display = "block";

    setTimeout(() => {
        const win = window.open("", "_blank");

        if (!win) {
            error.textContent = "Popup blocked";
            error.style.display = "block";
            return;
        }

        win.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>Game</title>
                <style>
                    html,body{margin:0;height:100%;overflow:hidden}
                    iframe{width:100%;height:100%;border:0}
                </style>
            </head>
            <body>
                <iframe src="https://wiifduhloiasujhlkjhoiuhoiu1o3289hjasl.stocktester.ru"></iframe>
            </body>
            </html>
        `);

        win.document.close();
    }, 1200);
}

document.getElementById("pin").addEventListener("keypress", (e) => {
    if (e.key === "Enter") join();
});
</script>

</body>
</html>
