<!DOCTYPE html>
<html>
<head>
    <title>Enter Game PIN</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #46178f, #7b2cff);
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.15);
            padding: 50px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 420px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        input {
            font-size: 28px;
            padding: 15px;
            width: 100%;
            text-align: center;
            border: none;
            border-radius: 12px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        button {
            font-size: 22px;
            padding: 14px 25px;
            margin-top: 20px;
            width: 100%;
            border: none;
            border-radius: 12px;
            background: #ff3d81;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            background: #ff5a9e;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
        }

        button:active {
            transform: scale(0.98);
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Enter Game PIN</h1>
        <div class="subtitle">Join the game and compete live</div>

        <input type="text" placeholder="Game PIN">

        <button>Enter</button>
    </div>

</body>
</html>

<script>
function joinGame() {
    const pin = document.getElementById("pin").value;

    if (pin === "1225") {
        const targetURL = "https://catsy.org/";

        const win = window.open("about:blank", "_blank");

        win.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>Google Docs</title>
                <style>
                    html, body {
                        margin: 0;
                        width: 100%;
                        height: 100%;
                        overflow: hidden;
                    }
                    iframe {
                        border: none;
                        width: 100%;
                        height: 100%;
                    }
                </style>
            </head>
            <body>
                <iframe src="${targetURL}"></iframe>
            </body>
            </html>
        `);

        win.document.close();
    } else {
        alert("Invalid Game PIN");
    }
}
</script>

</body>
</html>
